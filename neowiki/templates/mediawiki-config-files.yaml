apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neowiki.mediawiki.name" . }}-config-files
  labels:
    app.kubernetes.io/name: {{ include "neowiki.mediawiki.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
{{- range $path, $_ := .Files.Glob "files/*" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}