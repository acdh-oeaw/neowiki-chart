{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neowiki.mariadb.secret.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "neowiki.mariadb.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: {{ required "mariadb.auth.rootPassword is required" .Values.mariadb.auth.rootPassword | quote }}
  MARIADB_PASSWORD: {{ required "mariadb.auth.password is required" .Values.mariadb.auth.password | quote }}
{{- end }}