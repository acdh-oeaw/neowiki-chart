{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neowiki.mariadbSecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "neowiki.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: {{ required "mariadb.rootPassword is required" .Values.mariadb.rootPassword | quote }}
  MARIADB_PASSWORD: {{ required "mariadb.password is required" .Values.mariadb.password | quote }}
{{- end }}