apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neowiki.mediawiki.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "neowiki.mediawiki.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "neowiki.mediawiki.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "neowiki.mediawiki.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: initial-setup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -e
              until php -r '
              mysqli_report(MYSQLI_REPORT_OFF);
              try {
                $m = @new mysqli(getenv("MARIADB_HOST"), getenv("MARIADB_USER"), getenv("MARIADB_PASSWORD"), getenv("MARIADB_DATABASE"), (int)(getenv("MARIADB_PORT") ?: 3306));
                if ($m->connect_errno) { exit(1); }
                $res = @$m->query("SELECT 1 FROM page LIMIT 1");
                if ($res && $res->num_rows > 0) { exit(0); }
                exit(2);
              } catch (Throwable $e) {
                exit(1);
              }
              '; status=$?; [ $status -eq 0 ] || [ $status -eq 2 ]; do
                echo "Waiting for database connection..."
                sleep 2
              done

              if [ $status -eq 2 ]; then
                echo "Database not initialized. Installing MediaWiki..."
                php maintenance/run.php install \
                  --confpath /tmp \
                  --dbuser "$MARIADB_USER" \
                  --dbpass "$MARIADB_PASSWORD" \
                  --dbname "$MARIADB_DATABASE" \
                  --dbserver "$MARIADB_HOST:$MARIADB_PORT" \
                  --lang en \
                  --pass "$MW_ADMIN_PASSWORD" \
                  --server "$MW_SERVER" \
                  "$MW_SITE_NAME" "$MW_ADMIN_NAME"
              fi

              echo "Running database updates..."
              php maintenance/run.php update --quick
          volumeMounts:
            - name: config-files
              mountPath: /var/www/html/w/LocalSettings.php
              subPath: LocalSettings.php
              readOnly: true
          env:
            # MariaDB env
            - name: MARIADB_HOST
              value: {{ ternary .Values.externalDatabase.host ( include "neowiki.mariadb.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_PORT
              value: {{ ternary (toString .Values.externalDatabase.port) "3306" .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_DATABASE
              value: {{ ternary .Values.externalDatabase.database ( include "neowiki.mariadb.database.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_USER
              value: {{ ternary .Values.externalDatabase.user ( include "neowiki.mariadb.user.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MARIADB_PASSWORD
                  name: {{ include "neowiki.mariadb.secret.name" . }}
                  optional: false
            # MediaWiki settings
            - name: MW_SITE_NAME
              value: {{ default "NeoWiki Demo" .Values.mediawiki.siteName | quote }}
            - name: MW_ADMIN_NAME
              value: {{ default "AdminName" .Values.mediawiki.adminUser | quote }}
            - name: MW_ADMIN_PASSWORD
              value: {{ include "neowiki.mediawiki.validateAdminPassword" . | required "mediawiki.adminPassword is required (10 characters)" | quote }}
            - name: MW_TOKEN
              value: {{ include "neowiki.mediawiki.validateSecretToken" . | required "mediawiki.secretToken is required (64 random characters)" | quote }}
            - name: MW_SERVER
              value: {{ ternary "https" "http" .Values.mediawiki.tls.enabled }}://{{ .Values.mediawiki.server }}
            - name: MW_SMTP_HOST
              value: {{ default "" .Values.mediawiki.smtpHost | quote }}

            # Neo4j env
            - name: NEO4J_SCHEME
              value: "bolt"
            - name: NEO4J_HOST
              value: {{ ternary .Values.externalNeo4j.host (printf "%s-neo4j-lb-neo4j" (include "neowiki.fullname" .)) .Values.externalNeo4j.enabled | quote }}
            - name: NEO4J_PORT
              value: "7687"
            - name: NEO4J_URL_EXTERNAL
              value: {{ include "neowiki.neo4j.urlExternal" . | quote }}
            - name: NEO4J_USERNAME
              value: "neo4j"
            - name: NEO4J_PASSWORD
              value: {{ ternary .Values.externalNeo4j.password .Values.neo4j.neo4j.password .Values.externalNeo4j.enabled | quote }}
            {{- if .Values.externalNeo4j.enabled }}
            - name: NEO4J_USERNAME_READ
              value: {{ default "" .Values.externalNeo4j.readUser | quote }}
            - name: NEO4J_PASSWORD_READ
              value: {{ default "" .Values.externalNeo4j.readPassword | quote }}
            {{- else if .Values.neo4j.enabled }}
            - name: NEO4J_USERNAME_READ
              valueFrom:
                secretKeyRef:
                  key: NEO4J_USERNAME_READ
                  name: {{ include "neowiki.neo4j.readAuthSecret.name" . }}
                  optional: false
            - name: NEO4J_PASSWORD_READ
              valueFrom:
                secretKeyRef:
                  key: NEO4J_PASSWORD_READ
                  name: {{ include "neowiki.neo4j.readAuthSecret.name" . }}
                  optional: false
            {{- else }}
            - name: NEO4J_USERNAME_READ
              value: ""
            - name: NEO4J_PASSWORD_READ
              value: ""
            {{- end }}

            # QLever / SPARQL
            - name: QLEVER_ACCESS_TOKEN
              value: {{ .Values.qlever.accessToken | quote }}
            {{- if and .Values.qlever.enabled .Values.sparql.useQlever }}
            - name: QLEVER_URL
              value: {{ include "neowiki.qlever.url" . | quote }}
            {{- else }}
            - name: QLEVER_URL
              value: ""
            {{- end }}
      containers:
        - name: mediawiki
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            # MariaDB env
            - name: MARIADB_HOST
              value: {{ ternary .Values.externalDatabase.host ( include "neowiki.mariadb.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_PORT
              value: {{ ternary (toString .Values.externalDatabase.port) "3306" .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_DATABASE
              value: {{ ternary .Values.externalDatabase.database ( include "neowiki.mariadb.database.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_USER
              value: {{ ternary .Values.externalDatabase.user ( include "neowiki.mariadb.user.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MARIADB_PASSWORD
                  name: {{ include "neowiki.mariadb.secret.name" . }}
                  optional: false

            # MediaWiki settings
            - name: MW_SITE_NAME
              value: {{ default "NeoWiki Demo" .Values.mediawiki.siteName | quote }}
            - name: MW_TOKEN
              value: {{ include "neowiki.mediawiki.validateSecretToken" . | required "mediawiki.secretToken is required (64 random characters)" | quote }}
            - name: MW_SERVER
              value: {{ ternary "https" "http" .Values.mediawiki.tls.enabled }}://{{ .Values.mediawiki.server }}
            - name: MW_SMTP_HOST
              value: {{ default "" .Values.mediawiki.smtpHost | quote }}

            # Neo4j env
            - name: NEO4J_SCHEME
              value: "bolt"
            - name: NEO4J_HOST
              value: {{ ternary .Values.externalNeo4j.host (printf "%s-neo4j-lb-neo4j" (include "neowiki.fullname" .)) .Values.externalNeo4j.enabled | quote }}
            - name: NEO4J_PORT
              value: "7687"
            - name: NEO4J_URL_EXTERNAL
              value: {{ include "neowiki.neo4j.urlExternal" . | quote }}
            - name: NEO4J_USERNAME
              value: "neo4j"
            - name: NEO4J_PASSWORD
              value: {{ ternary .Values.externalNeo4j.password .Values.neo4j.neo4j.password .Values.externalNeo4j.enabled | quote }}
            {{- if .Values.externalNeo4j.enabled }}
            - name: NEO4J_USERNAME_READ
              value: {{ default "" .Values.externalNeo4j.readUser | quote }}
            - name: NEO4J_PASSWORD_READ
              value: {{ default "" .Values.externalNeo4j.readPassword | quote }}
            {{- else if .Values.neo4j.enabled }}
            - name: NEO4J_USERNAME_READ
              valueFrom:
                secretKeyRef:
                  key: NEO4J_USERNAME_READ
                  name: {{ include "neowiki.neo4j.readAuthSecret.name" . }}
                  optional: false
            - name: NEO4J_PASSWORD_READ
              valueFrom:
                secretKeyRef:
                  key: NEO4J_PASSWORD_READ
                  name: {{ include "neowiki.neo4j.readAuthSecret.name" . }}
                  optional: false
            {{- else }}
            - name: NEO4J_USERNAME_READ
              value: ""
            - name: NEO4J_PASSWORD_READ
              value: ""
            {{- end }}

            # QLever / SPARQL
            - name: QLEVER_ACCESS_TOKEN
              value: {{ .Values.qlever.accessToken | quote }}
            {{- if and .Values.qlever.enabled .Values.sparql.useQlever }}
            - name: QLEVER_URL
              value: {{ include "neowiki.qlever.url" . | quote }}
            {{- else }}
            - name: QLEVER_URL
              value: ""
            {{- end }}

          volumeMounts:
            - name: images
              mountPath: /var/www/html/w/images
            - name: config-files
              mountPath: /var/www/html/w/LocalSettings.php
              subPath: LocalSettings.php
              readOnly: true
          {{- if .Values.mediawiki.healthcheck.enabled }}
          readinessProbe:
            httpGet:
              path: /wiki/Special:Version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /wiki/Special:Version
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
{{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: {{ include "neowiki.mediawiki.name" . }}-images
        - name: config-files
          configMap:
            name: {{ include "neowiki.mediawiki.name" . }}-config-files
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "neowiki.mediawiki.name" . }}-images
  labels:
    app.kubernetes.io/name: {{ include "neowiki.mediawiki.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi