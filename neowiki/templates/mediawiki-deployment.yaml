apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neowiki.mediawiki.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "neowiki.mediawiki.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "neowiki.mediawiki.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "neowiki.mediawiki.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - args:
              # See the Makefile in the neowiki repository install-db, assumed it is idempotent
            - >-
              rm LocalSettings.php &&\
              php maintenance/run.php install --dbuser $MARIADB_USER --dbpass $MARIADB_PASSWORD \
                --dbname $MARIADB_DATABASE --dbserver $MARIADB_HOST:3306 --lang en \
                --pass $MW_ADMIN_PASSWORD \
                --server $MW_SERVER \
                SiteName AdminName &&\
              php maintenance/run.php update --quick
          command:
            - /bin/sh
            - '-c'
          env:
            # MariaDB env
            - name: MARIADB_HOST
              value: {{ ternary .Values.externalDatabase.host ( include "neowiki.mariadb.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_DATABASE
              value: {{ ternary .Values.externalDatabase.database ( include "neowiki.mariadb.database.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_USER
              value: {{ ternary .Values.externalDatabase.user ( include "neowiki.mariadb.user.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MARIADB_PASSWORD
                  name: neowiki-mariadb-auth
                  optional: false
            # MediaWiki settings
            - name: MW_ADMIN_PASSWORD
              value: {{ include "neowiki.mediawiki.validateAdminPassword" . | required "mediawiki.adminPassword is required (10 characters)" | quote }}
            - name: MW_SERVER
              value: {{ .Values.mediawiki.server | quote }}
          image: ghcr.io/professionalwiki/neowiki:latest
          imagePullPolicy: IfNotPresent
          name: initial-setup
      containers:
        - name: mediawiki
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            # MariaDB env
            - name: MARIADB_HOST
              value: {{ ternary .Values.externalDatabase.host ( include "neowiki.mariadb.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_DATABASE
              value: {{ ternary .Values.externalDatabase.database ( include "neowiki.mariadb.database.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_USER
              value: {{ ternary .Values.externalDatabase.user ( include "neowiki.mariadb.user.name" . ) .Values.externalDatabase.enabled | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MARIADB_PASSWORD
                  name: neowiki-mariadb-auth
                  optional: false

            # MediaWiki settings
            - name: MW_TOKEN
              value: {{ include "neowiki.mediawiki.validateSecretToken" . | required "mediawiki.secretToken is required (64 random characters)" | quote }}
            - name: MW_SERVER
              value: {{ .Values.mediawiki.server | quote }}
            - name: MW_SMTP_HOST
              value: {{ default "" .Values.mediawiki.smtpHost | quote }}

            # Neo4j env
            - name: NEO4J_HOST
              value: {{ ternary .Values.externalNeo4j.host (printf "%s-neo4j-lb-neo4j:7474" (include "neowiki.fullname" .)) .Values.externalNeo4j.enabled | quote }}
            - name: NEO4J_URL_EXTERNAL
              value: {{ include "neowiki.neo4j.urlExternal" . | quote }}
            - name: NEO4J_USERNAME
              value: "neo4j"
            - name: NEO4J_PASSWORD
              value: {{ ternary .Values.externalNeo4j.password .Values.neo4j.neo4j.password .Values.externalNeo4j.enabled | quote }}
            # Optional read-only user if you define it externally
            - name: NEO4J_USERNAME_READ
              value: {{ default "" .Values.externalNeo4j.readUser | quote }}
            - name: NEO4J_PASSWORD_READ
              value: {{ default "" .Values.externalNeo4j.readPassword | quote }}

            # QLever / SPARQL
            - name: QLEVER_ACCESS_TOKEN
              value: {{ .Values.qlever.accessToken | quote }}
            {{- if and .Values.qlever.enabled .Values.sparql.useQlever }}
            - name: QLEVER_URL
              value: {{ include "neowiki.qlever.url" . | quote }}
            {{- else }}
            - name: QLEVER_URL
              value: ""
            {{- end }}

          volumeMounts:
            - name: images
              mountPath: /var/www/html/w/images
            - name: config-files
              mountPath: /var/www/html/w/LocalSettings.php
              subPath: LocalSettings.php
              readOnly: true
          {{- if .Values.mediawiki.healthcheck.enabled }}
          readinessProbe:
            httpGet:
              path: /wiki/Special:Version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /wiki/Special:Version
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
{{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: {{ include "neowiki.mediawiki.name" . }}-images
        - name: config-files
          configMap:
            name: {{ include "neowiki.mediawiki.name" . }}-config-files
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "neowiki.mediawiki.name" . }}-images
  labels:
    app.kubernetes.io/name: {{ include "neowiki.mediawiki.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi